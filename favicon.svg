<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="smoothie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="55%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
  </defs>

  <!-- rounded background -->
  <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#bg)"/>

  <!-- straw -->
  <rect x="60" y="16" width="7" height="46" rx="3.5"
        fill="#22c55e" transform="rotate(18 63 39)"/>

  <!-- cup body (clipped contents) -->
  <clipPath id="cup">
    <path d="M30 36 H70 L64 78 Q63 82 59 82 H41 Q37 82 36 78 Z"/>
  </clipPath>
  <g clip-path="url(#cup)">
    <rect x="28" y="36" width="44" height="48" fill="#ffffff"/>
    <!-- smoothie fill -->
    <rect x="28" y="50" width="44" height="40" fill="url(#smoothie)"/>
    <!-- a lighter layer band -->
    <rect x="28" y="58" width="44" height="7" fill="#fde68a"/>
  </g>

  <!-- cup outline -->
  <path d="M30 36 H70 L64 78 Q63 82 59 82 H41 Q37 82 36 78 Z"
        fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>

  <!-- rim -->
  <rect x="27" y="31" width="46" height="8" rx="4" fill="#ffffff"/>
</svg>
